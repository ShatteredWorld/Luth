name: Build

on:
  push:
    branches: [veyra-main]
  pull_request:
    branches: [veyra-main]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        config: [Debug, Release, Dist]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.296.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
      with:
        arch: x64

    # No submodule cache: checkout already fetches submodules, and caching
    # luth/extern/source by .gitmodules hash clobbered vendored in-tree deps
    # (e.g. imguizmo) with stale copies, reverting committed fixes.

    - name: Configure CMake
      shell: cmd
      run: |
        cmake --preset windows

    - name: Build ${{ matrix.config }} x64
      run: cmake --build build --config ${{ matrix.config }} --parallel

    - name: Run smoke tests
      if: matrix.config == 'Debug'
      run: ctest --test-dir build -C ${{ matrix.config }} -L smoke --output-on-failure

    - name: Upload Release artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: luth-release-x64
        retention-days: 14
        path: |
          bin/windows-x86_64/Release/Runtime/Luthien.exe
          bin/windows-x86_64/Release/Runtime/slang-*.dll
          bin/windows-x86_64/Release/Luth/Luth.lib
